name: CI & Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate JSON & Manifest Syntax
        run: |
          bun -e '
            const files = [
              "server.json",
              ".mcp/server.json",
              "glama.json",
              ".claude-plugin/plugin.json",
              ".claude-plugin/marketplace.json",
              ".cursor-plugin/plugin.json",
              "gemini-extension.json",
              "packages/agentum-mcp/package.json",
              "packages/agentum-langchain/package.json",
              "packages/agentum-agentkit/package.json",
              "packages/agentum-x402-guard/package.json"
            ];
            for (const f of files) {
              const content = require("fs").readFileSync(f, "utf8");
              JSON.parse(content);
              console.log("✓ Validated JSON:", f);
            }
          '

      - name: Install MCP dependencies
        run: |
          cd packages/agentum-mcp && npm ci --registry=https://registry.npmjs.org --no-audit --no-fund

      - name: Test agentum-mcp CLI binary
        run: |
          node packages/agentum-mcp/bin/agentum-mcp.js --version
          node packages/agentum-mcp/bin/agentum-mcp.js --help

      - name: Run MCP package tests
        run: node --test packages/agentum-mcp/test/*.test.js

      - name: Install and validate LangChain package
        working-directory: packages/agentum-langchain
        run: |
          npm ci --registry=https://registry.npmjs.org --no-audit --no-fund
          bun test
          npm run build
          npm pack --dry-run

      - name: No private registry URLs in new package lockfiles
        run: |
          if grep -l "npm.dev.wixpress.com" packages/agentum-agentkit/*lock* packages/agentum-x402-guard/*lock* 2>/dev/null; then
            echo "::error::Private registry URL found in a lockfile"; exit 1
          fi

      - name: Install, build and test AgentKit action provider
        working-directory: packages/agentum-agentkit
        run: |
          npm ci --registry=https://registry.npmjs.org --no-audit --no-fund
          npm run build
          bun test
          npm pack --dry-run

      - name: Install, build and test x402 guard
        working-directory: packages/agentum-x402-guard
        run: |
          npm ci --registry=https://registry.npmjs.org --no-audit --no-fund
          npm run build
          bun test
          npm pack --dry-run

      - name: Check standalone bundle syntax
        run: bun build server/agentum-standalone.ts --target=bun --outfile=/tmp/agentum-standalone-check.js

      - name: Check public release status
        continue-on-error: true
        run: |
          npm view agentum-mcp version --registry=https://registry.npmjs.org
          npm view agentum-langchain version --registry=https://registry.npmjs.org
          npm view agentum-langchain@0.3.0 version --registry=https://registry.npmjs.org || true
          npm view agentum-agentkit version --registry=https://registry.npmjs.org || true
          npm view agentum-x402-guard version --registry=https://registry.npmjs.org || true
          curl --connect-timeout 10 --max-time 20 --fail --silent --show-error https://agentum.asimplek.cloud/health
