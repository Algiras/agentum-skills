name: Publish agentum-mcp to NPM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        default: agentum-mcp
        options:
          - agentum-mcp
          - agentum-langchain
          - agentum-x402-guard
          - agentum-agentkit
      tag:
        description: "NPM dist-tag (e.g. latest, beta)"
        required: false
        default: "latest"
      dry_run:
        description: "agentum-x402-guard / agentum-agentkit only: build and test but do not publish"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish-npm:
    if: github.event_name == 'release' || inputs.package == 'agentum-mcp'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Verify package tarball
        working-directory: packages/agentum-mcp
        run: |
          echo "Verifying package tarball contents..."
          npm pack --dry-run

      - name: Publish to NPM
        working-directory: packages/agentum-mcp
        run: |
          echo "Publishing agentum-mcp to https://registry.npmjs.org/..."
          npm publish --access public --tag ${{ github.event.inputs.tag || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-langchain:
    if: github.event_name == 'workflow_dispatch' && inputs.package == 'agentum-langchain'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      - name: Check existing npm version
        id: npm-check
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import https from 'node:https';
          import fs from 'node:fs';
          const desired = JSON.parse(fs.readFileSync('packages/agentum-langchain/package.json', 'utf8')).version;
          const desiredParts = desired.match(/^(\d+)\.(\d+)\.(\d+)$/)?.slice(1).map(Number);
          if (!desiredParts) throw new Error('Package version must be a stable semver');
          const request = https.get('https://registry.npmjs.org/agentum-langchain', response => {
            let body = '';
            response.on('data', chunk => { body += chunk; });
            response.on('end', () => {
              if (response.statusCode !== 200 && response.statusCode !== 404) {
                console.error(`npm returned HTTP ${response.statusCode}`); process.exitCode = 1; return;
              }
              const data = response.statusCode === 200 ? JSON.parse(body) : {};
              const latest = data['dist-tags']?.latest;
              const exists = !!data.versions?.[desired];
              if (latest === '0.0.0-stage') {
                console.log(JSON.stringify({status: response.statusCode, latest, processing: true, publish: false}));
                fs.appendFileSync(process.env.GITHUB_OUTPUT, 'publish=false\n'); return;
              }
              const current = latest?.match(/^(\d+)\.(\d+)\.(\d+)$/)?.slice(1).map(Number);
              const newer = current && (current[0] > desiredParts[0] || (current[0] === desiredParts[0] && (current[1] > desiredParts[1] || (current[1] === desiredParts[1] && current[2] >= desiredParts[2]))));
              if (!exists && latest && !current) { console.error(`Cannot safely compare latest version: ${latest}`); process.exitCode = 1; return; }
              const publish = !exists && !newer;
              console.log(JSON.stringify({status: response.statusCode, latest: latest ?? null, versionExists: exists, publish}));
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `publish=${publish}\n`);
            });
          });
          request.setTimeout(15000, () => request.destroy(new Error('npm request timed out')));
          request.on('error', error => { console.error(error.message); process.exitCode = 1; });
          NODE
      - name: Install and validate package
        if: steps.npm-check.outputs.publish == 'true'
        working-directory: packages/agentum-langchain
        run: |
          bun install --frozen-lockfile
          bun test
          npm run build
          npm pack --dry-run
      - name: Publish agentum-langchain
        if: steps.npm-check.outputs.publish == 'true'
        working-directory: packages/agentum-langchain
        run: npm publish --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-integration-packages:
    # Manual only. Defaults to a dry run; set dry_run=false to publish for real.
    if: github.event_name == 'workflow_dispatch' && (inputs.package == 'agentum-x402-guard' || inputs.package == 'agentum-agentkit')
    runs-on: ubuntu-latest
    env:
      PKG: ${{ inputs.package }}
      DRY_RUN: ${{ inputs.dry_run }}
      DIST_TAG: ${{ inputs.tag || 'latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      - name: Refuse a version that is already on npm
        run: |
          NAME=$(node -p "require('./packages/$PKG/package.json').name")
          VERSION=$(node -p "require('./packages/$PKG/package.json').version")
          echo "Package: $NAME@$VERSION (tag: $DIST_TAG, dry run: $DRY_RUN)"
          if npm view "$NAME@$VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already published. Bump the version in package.json first."
            exit 1
          fi
      - name: Install AgentKit (the guard's end-to-end tests use its x402 client)
        if: inputs.package == 'agentum-x402-guard'
        working-directory: packages/agentum-agentkit
        run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund
      - name: Install, build and test
        working-directory: packages/${{ inputs.package }}
        run: |
          npm ci --registry=https://registry.npmjs.org --no-audit --no-fund
          npm run build
          bun test
          npm pack --dry-run
      - name: Publish
        working-directory: packages/${{ inputs.package }}
        run: |
          if [ "$DRY_RUN" = "false" ]; then
            npm publish --access public --tag "$DIST_TAG"
          else
            echo "Dry run: not publishing."
            npm publish --access public --tag "$DIST_TAG" --dry-run
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
